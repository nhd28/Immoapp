<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f766e; color: #fff;
      font: 16px/1.5 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    button { font: inherit; padding: 12px 24px; border-radius: 10px; border: 0; background: #fff; color: #0f766e; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <div style="font-size:48px">📡</div>
    <h1>Keine Verbindung</h1>
    <p>Der Immo-Server ist gerade nicht erreichbar.<br />Prüfe deine Internetverbindung.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </div>
</body>
</html>
